# ============================================================================
# Peplink 設定管理コンソール 接続設定
# ============================================================================
# このファイルを config.yaml という名前でコピーして編集してください。
#     cp config.example.yaml config.yaml
#
# config.yaml には機器のパスワードやAPIシークレットを書くため、
# .gitignore で除外されています(Gitにコミットされません)。
# ============================================================================

# 設定変更を許可するか。
#   false … 参照専用(機器には一切書き込みません)。まずはこちらで運用を始めてください
#   true  … 設定エディタからの反映(Apply)を許可します
allow_write: false

devices:
  # --------------------------------------------------------------------------
  # 1台目 — APIトークンで認証する例(推奨)
  # --------------------------------------------------------------------------
  - id: relay-01                    # 内部識別子(英数字。任意の文字列)
    label: 中継車1号                 # 画面に表示する名前
    model: MAX BR2 Pro              # 機種名。Router APIから取得できないため手入力します
    host: 192.168.50.1              # 機器のLAN IPアドレス(または到達可能なIP/FQDN)
    scheme: https                   # https を推奨。http は平文になります
    # port: 8443                    # Web管理ポートを変更している場合のみ指定
    profile: live-broadcast         # 監査に使うプロファイル(profiles/*.yaml の profile 名)

    # 認証方法A: APIトークン(Web GUIで発行。パスワードをこのファイルに書かずに済みます)
    client_id: ここにclientIdを貼る
    client_secret: ここにclientSecretを貼る

    # verify_tls: false             # 自己署名証明書のため既定でfalse。社内CA証明書を入れている場合はtrue
    # timeout: 15                   # 機器へのHTTPタイムアウト(秒)

  # --------------------------------------------------------------------------
  # 2台目 — 管理者ユーザー名/パスワードで認証する例
  # --------------------------------------------------------------------------
  - id: relay-02
    label: 中継車2号
    model: MAX Transit Pro Duo
    host: 192.168.51.1
    scheme: https
    profile: live-broadcast

    # 認証方法B: 管理者アカウント
    # 参照専用で使いたい場合は、機器側で Read-only ユーザーを作ってそれを指定してください
    username: admin
    password: ここに機器の管理パスワード

# ============================================================================
# 補足
# ----------------------------------------------------------------------------
# * client_id / client_secret と username / password は、機器ごとにどちらか一方を書きます
#   (両方書いた場合はトークンが優先されます)
# * profile を省略すると、その機器は監査画面で判定されません(状態表示のみ)
# * 遠隔地の機器を扱う場合は、SpeedFusion や社内VPN経由で機器の管理画面に
#   到達できるネットワークからこのツールを動かしてください
# ============================================================================
